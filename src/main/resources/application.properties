# =============================================================================
# ShiftMate — Application Configuration
# ISTE-432 Database Application Development
# =============================================================================

# --- Server ---
server.port=8080

# --- DataSource (MySQL 8.0) ---
spring.datasource.url=jdbc:mysql://localhost:3306/shiftmate?useSSL=false&serverTimezone=Europe/Zagreb&allowPublicKeyRetrieval=true
spring.datasource.username=shiftmate_user
spring.datasource.password=shiftmate_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- HikariCP Connection Pool ---
spring.datasource.hikari.pool-name=ShiftMatePool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- JPA / Hibernate ---
# 'validate' in production: schema is managed by the SQL script, not Hibernate
spring.jpa.defer-datasource-initialization=true
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Enable second-level cache for reference data (roles, departments)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.open-in-view=false

# --- Logging ---
logging.level.com.shiftmate=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# --- Spring Security ---
# Disable default generated password (we configure our own)
spring.security.user.name=ignored
